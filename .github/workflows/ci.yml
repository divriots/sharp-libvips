name: CI
on:
  - push
  - pull_request
permissions: {}
jobs:
  check-latest-versions:
    permissions:
      contents: read
    runs-on: 'ubuntu-26.04'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reports newer versions, never blocks the build.
      - run: ./check-latest-versions.sh && git diff
  build:
    permissions:
      contents: read
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Only the platforms the divriots monorepo overrides.
      matrix:
        include:
          - os: 'ubuntu-26.04'
            platform: 'linux-x64'
          - os: 'macos-15'
            platform: 'darwin-arm64v8'
          - os: 'ubuntu-26.04-arm'
            platform: 'linux-arm64v8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          pipx install meson
          brew install automake nasm
      - name: Build ${{ matrix.platform }}
        run: ./build.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.platform }}
          path: '*.tar.gz'
          compression-level: 0
          # Releases are published with ./publish-divriots.sh, from these
          # artifacts or local builds.
          retention-days: 7
          if-no-files-found: error
